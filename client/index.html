<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poké Roulette</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="main">
  <!-- Roulette Screen -->
  <div id="roulette-screen" class="screen active">
    <div id="wheel-container">
      <div id="pointer"></div>
      <svg id="wheel-svg" viewBox="-260 -260 520 520" xmlns="http://www.w3.org/2000/svg">
        <defs id="wheel-defs"></defs>
        <g id="wheel-group"></g>
        <circle cx="0" cy="0" r="250" fill="none" stroke="black" stroke-width="2.5"/>
        <circle id="wheel-hole" cx="0" cy="0" r="94" fill="var(--bg)"/>
        <circle cx="0" cy="0" r="94" fill="none" stroke="black" stroke-width="2.5"/>
      </svg>
      <div id="wheel-center-text"></div>
    </div>
    <div id="empty-wheel-msg" style="display:none">
      No Pokémon in the roulette list.<br>Add some to get started.
    </div>
  </div>

  <!-- Silhouette Screen -->
  <div id="silhouette-screen" class="screen">
    <div id="silhouette-name-area" class="pokemon-display-name"></div>
    <div class="sprite-wrapper" id="silhouette-wrapper">
      <div class="spinner" id="silhouette-spinner"></div>
    </div>
    <div class="card-meta">
      <span id="silhouette-gen" class="gen-label"></span>
      <div id="silhouette-types" class="type-badges"></div>
    </div>
    <div id="silhouette-dex"></div>
    <div class="action-buttons">
      <button class="action-btn btn-return" id="btn-reveal-all">Reveal all</button>
    </div>
  </div>

  <!-- Detail Screen -->
  <div id="detail-screen" class="screen">
    <div id="detail-name-row">
      <button id="btn-bio" title="Biology">📖</button>
      <div id="detail-name" class="pokemon-display-name"></div>
      <button id="btn-close-detail" title="Return to roulette">✕</button>
    </div>
    <div class="sprite-wrapper" id="detail-wrapper">
      <img id="detail-img" src="" alt="">
    </div>
    <div id="detail-bio"></div>
    <div class="card-meta">
      <span id="detail-gen" class="gen-label"></span>
      <div id="detail-types" class="type-badges"></div>
    </div>
    <div id="detail-dex"></div>
    <div class="action-buttons">
      <button class="action-btn btn-remove"  id="btn-remove"  title="Move to The Pile">To The Pile!</button>
      <button class="action-btn btn-confirm" id="btn-confirm" title="Move to Drawn">Drawn!</button>
    </div>
    <div id="detail-dup-warning" style="display:none"></div>
  </div>

  <!-- Duplicate Resolver Screen -->
  <div id="duplicate-screen" class="screen">
    <div id="dup-header">
      <div style="width:28px;flex-shrink:0"></div>
      <div id="dup-title" class="pokemon-display-name"></div>
      <button id="btn-close-dup" title="Return to roulette">✕</button>
    </div>
    <div id="dup-columns">
      <div class="dup-column" id="dup-col-pool">
        <div class="dup-col-header">
          <span>Roulette</span>
          <button class="dup-select-all" data-list="pool">Select All</button>
        </div>
        <div class="dup-col-body" id="dup-body-pool"></div>
      </div>
      <div class="dup-column" id="dup-col-done">
        <div class="dup-col-header">
          <span>Drawn</span>
          <button class="dup-select-all" data-list="done">Select All</button>
        </div>
        <div class="dup-col-body" id="dup-body-done"></div>
      </div>
      <div class="dup-column" id="dup-col-todo">
        <div class="dup-col-header">
          <span>The Pile</span>
          <button class="dup-select-all" data-list="todo">Select All</button>
        </div>
        <div class="dup-col-body" id="dup-body-todo"></div>
      </div>
    </div>
    <button id="btn-resolve" class="action-btn btn-confirm">Resolve</button>
  </div>
</div>

<!-- Sidebar -->
<aside id="sidebar">
  <div id="sidebar-tabbar">
    <button id="sidebar-toggle" title="Collapse sidebar">›</button>
    <button class="tab-btn active" id="tab-lists" title="Lists">📚</button>
    <button class="tab-btn" id="tab-online" title="Online">🌐</button>
    <div style="flex:1"></div>
    <button class="tab-btn" id="tab-config" title="Config">⚙️</button>
  </div>
  <div id="sidebar-content">

  <!-- Lists view -->
  <div id="view-lists">
  <div id="room-indicator" style="display:none"></div>
  <div id="filter-bar">
    <input type="text" id="filter-name" placeholder="Filter by name…">
    <div id="filter-row2">
      <label class="sort-radio-label"><input type="radio" name="sort-order" value="id"> ID</label>
      <label class="sort-radio-label"><input type="radio" name="sort-order" value="name"> Name</label>
      <label class="sort-radio-label"><input type="radio" name="sort-order" value="type"> Type</label>
      <button id="sort-dir" title="Toggle sort direction">↑</button>
      <button id="filter-clear">Clear</button>
    </div>
  </div>

  <div class="lists-container">
    <div class="list-panel" id="panel-pool" data-list="pool">
      <div class="list-header" id="header-pool">
        <span class="list-collapse-arrow">▾</span>
        <span class="list-title">Roulette</span>
        <span class="list-count" id="count-pool">0 / 0</span>
        <button class="edit-btn is-pen" id="edit-pool" title="Edit list"><span class="pen-icon">✏</span></button>
      </div>
      <div class="list-body" id="body-pool"></div>
    </div>
    <div class="list-panel" id="panel-done" data-list="done">
      <div class="list-header" id="header-done">
        <span class="list-collapse-arrow">▾</span>
        <span class="list-title">Drawn</span>
        <span class="list-count" id="count-done">0 / 0</span>
        <button class="edit-btn is-pen" id="edit-done" title="Edit list"><span class="pen-icon">✏</span></button>
      </div>
      <div class="list-body" id="body-done"></div>
    </div>
    <div class="list-panel" id="panel-todo" data-list="todo">
      <div class="list-header" id="header-todo">
        <span class="list-collapse-arrow">▾</span>
        <span class="list-title">The Pile</span>
        <span class="list-count" id="count-todo">0 / 0</span>
        <button class="edit-btn is-pen" id="edit-todo" title="Edit list"><span class="pen-icon">✏</span></button>
      </div>
      <div class="list-body" id="body-todo"></div>
    </div>
  </div>

  <button id="reset-btn">↺ Reset all lists</button>
  </div><!-- #view-lists -->

  <!-- Config view -->
  <div id="view-config">
    <div class="config-section">
      <div class="config-section-title">Hints</div>
      <div class="hint-row">
        <div class="hint-row-label">Name</div>
        <div class="hint-options">
          <label class="hint-radio-label default"><input type="radio" name="hint-name" value="hidden"> Hidden</label>
          <label class="hint-radio-label"><input type="radio" name="hint-name" value="disabled"> Disabled</label>
        </div>
      </div>
      <div class="hint-row">
        <div class="hint-row-label">Sprite</div>
        <div class="hint-options">
          <label class="hint-radio-label default"><input type="radio" name="hint-sprite" value="hidden"> Hidden</label>
          <label class="hint-radio-label"><input type="radio" name="hint-sprite" value="visible"> Visible</label>
        </div>
      </div>
      <div class="hint-row">
        <div class="hint-row-label">Types</div>
        <div class="hint-options">
          <label class="hint-radio-label"><input type="radio" name="hint-types" value="visible"> Visible</label>
          <label class="hint-radio-label default"><input type="radio" name="hint-types" value="hidden"> Hidden</label>
          <label class="hint-radio-label"><input type="radio" name="hint-types" value="disabled"> Disabled</label>
        </div>
      </div>
      <div class="hint-row">
        <div class="hint-row-label">Generation</div>
        <div class="hint-options">
          <label class="hint-radio-label"><input type="radio" name="hint-gen" value="visible"> Visible</label>
          <label class="hint-radio-label default"><input type="radio" name="hint-gen" value="hidden"> Hidden</label>
          <label class="hint-radio-label"><input type="radio" name="hint-gen" value="disabled"> Disabled</label>
        </div>
      </div>
      <div class="hint-row">
        <div class="hint-row-label">Pokédex</div>
        <div class="hint-options">
          <label class="hint-radio-label"><input type="radio" name="hint-dex" value="visible"> Visible</label>
          <label class="hint-radio-label default"><input type="radio" name="hint-dex" value="hidden"> Hidden</label>
          <label class="hint-radio-label"><input type="radio" name="hint-dex" value="disabled"> Disabled</label>
        </div>
      </div>
    </div>
    <div class="config-section">
      <div class="config-section-title">Generations</div>
      <div id="gen-checkboxes"></div>
    </div>
    <div class="config-section">
      <div class="config-section-title">Theme</div>
      <div id="theme-presets"></div>
      <div id="theme-pickers"></div>
    </div>
    <div class="config-section">
      <div class="config-section-title">Import / Export</div>
      <textarea id="import-export-area" placeholder="Paste exported data here to import…" spellcheck="false"></textarea>
      <div class="config-btn-row">
        <button class="config-btn" id="btn-export">Export</button>
        <button class="config-btn" id="btn-import">Import</button>
      </div>
    </div>
  </div><!-- #view-config -->

  <!-- Online view -->
  <div id="view-online" style="display:none;flex:1;flex-direction:column;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;padding:12px;gap:12px;min-width:0;"></div>

  </div><!-- #sidebar-content -->
</aside>

<script type="module" src="app.js"></script>
</body>
</html>
