    const found = Object.entries(listNames)
      .filter(([key]) => lists[key].some(raw => matchPokemon(raw)?.id === p.id))
      .map(([, label]) => label);
    const last = found.pop();
    dupWarning.textContent = '⚠ Duplicate in ' + (found.length ? found.join(', ') + ' and ' + last : last);
    dupWarning.style.display = '';
  } else {
    dupWarning.style.display = 'none';
  }

  showScreen('detail');
}

function getAllDuplicatePokemon() {
  const inLists = new Map(); // pokemonId -> Set of listNames
  for (const ln of ['pool', 'done', 'todo']) {
    for (const raw of lists[ln]) {
      const p = matchPokemon(raw);
      if (!p) continue;
      if (!inLists.has(p.id)) inLists.set(p.id, new Set());
      inLists.get(p.id).add(ln);
    }
  }
  return [...inLists.entries()]
    .filter(([, set]) => set.size > 1)
    .map(([id]) => allPokemon.find(p => p.id === id))
    .filter(Boolean);
}

function showDuplicateResolver() {
  duplicatePokemon = null;
  duplicateSelected = new Set();
  const dups = getAllDuplicatePokemon();
  document.getElementById('dup-title').textContent =
    dups.length === 1 ? dups[0].name : `${dups.length} duplicates`;
  renderDuplicateResolver();
  showScreen('duplicate');
}

function renderDuplicateResolver() {
  const dupPokemon = getAllDuplicatePokemon();

  for (const ln of ['pool', 'done', 'todo']) {
    const body = document.getElementById(`dup-body-${ln}`);
    body.innerHTML = '';

    for (const p of dupPokemon) {
      const entries = lists[ln]
        .map((raw, idx) => ({ raw, idx }))
        .filter(({ raw }) => matchPokemon(raw)?.id === p.id);

      const label = document.createElement('div');
      label.className = 'dup-group-label';
      label.textContent = p.name;
      body.appendChild(label);

      if (entries.length === 0) {
        const gap = document.createElement('div');
        gap.className = 'dup-col-gap';
        gap.textContent = '—';
        body.appendChild(gap);
        continue;
      }

      // Count selected keys for this pokemon group
      const groupKeys = entries.map(({ idx }) => `${p.id}:${ln}:${idx}`);
      const anyInGroupSelected = groupKeys.some(k => duplicateSelected.has(k));

      for (const { raw, idx } of entries) {
        const key = `${p.id}:${ln}:${idx}`;
        const isSelected = duplicateSelected.has(key);
        const isDimmed = anyInGroupSelected && !isSelected;
        const item = document.createElement('div');
        item.className = 'dup-item' +
          (isSelected ? ' selected' : '') +
          (isDimmed ? ' dimmed' : '');
        item.textContent = raw;
        item.addEventListener('click', () => {
          if (isSelected) {
            duplicateSelected.delete(key);
          } else {
            // Deselect all keys for this pokemon, then select this one
            for (const k of [...duplicateSelected]) {
              if (k.startsWith(`${p.id}:`)) duplicateSelected.delete(k);
            }
            duplicateSelected.add(key);
          }
          renderDuplicateResolver();
        });
        body.appendChild(item);
      }
    }
  }
}

function resolveDuplicate() {
  const dupPokemon = getAllDuplicatePokemon();
  for (const p of dupPokemon) {
    const anySelected = [...duplicateSelected].some(k => k.startsWith(`${p.id}:`));
    if (!anySelected) continue;
    for (const ln of ['pool', 'done', 'todo']) {
      const toKeep = new Set();
      lists[ln].forEach((raw, idx) => {
        if (matchPokemon(raw)?.id === p.id && duplicateSelected.has(`${p.id}:${ln}:${idx}`))
          toKeep.add(idx);
      });
      lists[ln] = lists[ln].filter((raw, idx) => {
        if (matchPokemon(raw)?.id !== p.id) return true;
        return toKeep.has(idx);
      });
    }
  }
  saveLists();
  validateAll();
  renderSidebar();
  returnToRoulette();
}

function returnToRoulette() {
  selectedPokemonIsDuplicate = false;
  detailOpenedFromList = false;
  document.querySelectorAll('.entry-row.active').forEach(r => r.classList.remove('active'));
  showScreen('roulette');
  buildWheel();
  spinState = 'idle';
  winner = null;
  wheelVelocity = 0;
  updateCenterText();
  startIdleSpin();
}

// ── LIST ACTIONS ──
function movePokemon(p, targetList) {
  // Remove from all lists
  for (const ln of ['pool', 'done', 'todo']) {
    lists[ln] = lists[ln].filter(raw => {
      const matched = matchPokemon(raw);
      return !matched || matched.id !== p.id;
    });
  }
  lists[targetList].push(p.name);
  saveLists();
  validateAll();
  renderSidebar();
}

// ── SIDEBAR RENDERING ──
function renderSidebar() {
  for (const listName of ['pool', 'done', 'todo']) {
    if (editMode[listName]) continue; // don't re-render while editing
    renderList(listName);
  }
  renderRoomIndicator();
}

function renderRoomIndicator() {
  const bar = document.getElementById('room-indicator');
  if (!currentRoom) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  bar.innerHTML = '';

  const dot = document.createElement('span');
  dot.className = `online-conn-dot ${sseConnected ? 'green' : 'amber'}`;

  const label = document.createElement('span');
  label.textContent = 'Room\u00a0';

  const code = document.createElement('span');
  code.className = 'room-ind-code';
  code.textContent = currentRoom.code;

  const role = document.createElement('span');
  role.className = `online-role-badge role-${currentRoom.role} room-ind-role`;
  role.textContent = currentRoom.role;

  bar.append(dot, label, code, role);
}

function renderList(listName) {
  const body = document.getElementById(`body-${listName}`);
  const entries = validatedEntries[listName];

  // Apply filters (display only) then sort
  const visible = entries.filter(e => matchesFilter(e)).sort((a, b) => {
    const aErr = a.status !== 'valid', bErr = b.status !== 'valid';
    if (aErr !== bErr) return aErr ? -1 : 1;
    if (sortOrder === 'none' || !a.pokemon || !b.pokemon) return 0;
    const dir = sortAsc ? 1 : -1;
    if (sortOrder === 'name') return dir * a.pokemon.name.localeCompare(b.pokemon.name);
    if (sortOrder === 'type') {
      const t = a.pokemon.type1.localeCompare(b.pokemon.type1);
      if (t !== 0) return dir * t;
      return dir * (a.pokemon.type2 || '').localeCompare(b.pokemon.type2 || '');
    }
    return dir * (a.pokemon.id - b.pokemon.id);
  });

  // Update count
  document.getElementById(`count-${listName}`).textContent =
    `${visible.length} / ${entries.length}`;

  // FLIP: snapshot positions before clearing
  const doFlip = animateNextRender;
  const oldTops = new Map();
  if (doFlip) {
    body.querySelectorAll('.entry-row[data-pokemon-id]').forEach(r => {
      oldTops.set(r.dataset.pokemonId, r.getBoundingClientRect().top);
    });
  }

  body.innerHTML = '';

  for (const entry of visible) {
    const row = document.createElement('div');
    row.className = 'entry-row' + (entry.status !== 'valid' ? ` ${entry.status}` : '');

    if (entry.status === 'valid' || entry.status === 'duplicate') {
      if (entry.pokemon) row.dataset.pokemonId = entry.pokemon.id;
      if (entry.status === 'valid') {
        if (currentScreen === 'roulette') {
          row.draggable = true;
          row.dataset.fromList = listName;
        }
      }
      if (entry.pokemon) {
        if (currentScreen !== 'roulette') row.style.cursor = 'pointer';
        row.addEventListener('click', () => {
          if (row.classList.contains('active')) {
            row.classList.remove('active');
            returnToRoulette();
            return;
          }
          document.querySelectorAll('.entry-row.active').forEach(r => r.classList.remove('active'));
          row.classList.add('active');
          selectedPokemon = entry.pokemon;
          selectedPokemonIsDuplicate = entry.status === 'duplicate';
          detailOpenedFromList = true;
          showDetail();
        });
      }
    }

    // Type dot
    const dot = document.createElement('div');
    dot.className = 'type-dot';
    if (entry.pokemon) {
      const c1 = TYPE_COLORS[entry.pokemon.type1] || '#888';
      if (entry.pokemon.type2) {
        dot.classList.add('split');
        dot.style.setProperty('--c1', c1);
        dot.style.setProperty('--c2', TYPE_COLORS[entry.pokemon.type2] || '#888');
      } else {
        dot.style.background = c1;
      }
    } else {
      dot.style.background = '#555';
    }
    row.appendChild(dot);

    const name = document.createElement('div');
    name.className = 'entry-name';
    name.textContent = entry.pokemon ? entry.pokemon.name : entry.raw;
    row.appendChild(name);

    if (entry.pokemon) {
      const gen = document.createElement('div');
      gen.className = 'entry-gen';
      gen.textContent = `G${entry.pokemon.gen}`;
      row.appendChild(gen);
    }

    if (entry.status === 'unknown') {
      const err = document.createElement('div');
      err.className = 'entry-error';
      err.textContent = '?';
      err.title = `Unknown: "${entry.raw}"`;
      row.appendChild(err);
    } else if (entry.status === 'duplicate') {
      const err = document.createElement('div');
      err.className = 'entry-dup-error';
      err.textContent = '⚠';
      err.title = 'Resolve duplicate';
      err.style.cursor = 'pointer';
      err.addEventListener('click', (e) => {
        e.stopPropagation();
        showDuplicateResolver();
      });
      row.appendChild(err);
    }

    // Drag events
    if (row.draggable) {
      row.addEventListener('dragstart', onDragStart);
      row.addEventListener('dragend', onDragEnd);
    }

    body.appendChild(row);
  }

  // Drop zones between entries
  if (currentScreen === 'roulette') {
    setupDropZones(body, listName);
  }

  // FLIP: play phase
  if (doFlip) {
    animateNextRender = false;
    body.querySelectorAll('.entry-row[data-pokemon-id]').forEach(row => {
      const oldTop = oldTops.get(row.dataset.pokemonId);
      if (oldTop === undefined) return;
      const delta = oldTop - row.getBoundingClientRect().top;
      if (Math.abs(delta) < 1) return;
      row.style.transform = `translateY(${delta}px)`;
      row.style.transition = 'none';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        row.style.transition = 'transform 0.2s ease';
        row.style.transform = '';
        row.addEventListener('transitionend', () => {
          row.style.transform = '';
          row.style.transition = '';
        }, { once: true });
      }));
    });
  }
}

function matchesFilter(entry) {
  if (filters.name) {
    const q = filters.name.toLowerCase();
    const displayName = entry.pokemon ? entry.pokemon.name.toLowerCase() : '';
    const rawName = entry.raw.toLowerCase();
    if (!displayName.includes(q) && !rawName.includes(q)) return false;
  }

  return true;
}

// ── DRAG & DROP ──
let dragData = null;

function onDragStart(e) {
  const row = e.currentTarget;
  dragData = {
    pokemonId: parseInt(row.dataset.pokemonId),
    fromList: row.dataset.fromList,
  };
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', row.dataset.pokemonId);
  document.getElementById('wheel-group').style.animationPlayState = 'paused';
}

function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  dragData = null;
  document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-active'));
  document.getElementById('wheel-group').style.animationPlayState = '';
}

function setupDropZones(body, listName) {
  const rows = body.querySelectorAll('.entry-row');

  // Create drop zone before each row and one at the end
  const makeZone = (beforeRow) => {
    const zone = document.createElement('div');
    zone.className = 'drop-zone';
    zone.dataset.targetList = listName;

    zone.addEventListener('dragover', (e) => {
      e.preventDefault();
      zone.classList.add('drag-active');
    });
    zone.addEventListener('dragleave', () => {
      zone.classList.remove('drag-active');
    });
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      zone.classList.remove('drag-active');
      if (!dragData) return;
      const insertBeforeId = beforeRow ? parseInt(beforeRow.dataset.pokemonId) : null;
      handleDrop(listName, dragData, insertBeforeId);
    });

    if (beforeRow) {
      body.insertBefore(zone, beforeRow);
    } else {
      body.appendChild(zone);
    }
  };

  // Re-insert zones between rows
  const existingRows = [...rows];
  existingRows.forEach(row => makeZone(row));
  makeZone(null);

  // Also make the entire body a drop target
  body.addEventListener('dragover', (e) => e.preventDefault());
  body.addEventListener('drop', (e) => {
    e.preventDefault();
    if (!dragData) return;
    handleDrop(listName, dragData, null);
  });
}

function handleDrop(targetList, data, insertBeforeId) {
  const p = allPokemon.find(p => p.id === data.pokemonId);
  if (!p) return;

  if (data.fromList === targetList) {
    if (sortOrder !== 'none') return;
    const lst = lists[targetList];
    const fromIdx = lst.findIndex(raw => matchPokemon(raw)?.id === p.id);
    if (fromIdx === -1) return;
    lst.splice(fromIdx, 1);
    if (insertBeforeId !== null) {
      const toIdx = lst.findIndex(raw => matchPokemon(raw)?.id === insertBeforeId);
      toIdx === -1 ? lst.push(p.name) : lst.splice(toIdx, 0, p.name);
    } else {
      lst.push(p.name);
    }
    saveLists();
    validateAll();
    animateNextRender = true;
    renderSidebar();
    return;
  }

  animateNextRender = true;
  movePokemon(p, targetList);
  buildWheel();
}

// ── EDIT MODE ──
function enterEditMode(listName) {
  if (currentScreen !== 'roulette') return;

  // Auto-expand if collapsed (must happen before editMode is set)
  if (panelCollapsed[listName]) togglePanelCollapse(listName);

  editMode[listName] = true;

  const body = document.getElementById(`body-${listName}`);
  const btn = document.getElementById(`edit-${listName}`);
  btn.textContent = '✓ Done';
  btn.classList.remove('is-pen');

  // Respect filters: show only filtered-in raws, preserve filtered-out raws for merge on exit
  const filteredIn  = validatedEntries[listName].filter(e =>  matchesFilter(e));
  const filteredOut = validatedEntries[listName].filter(e => !matchesFilter(e));
  editModeFilteredOut[listName] = filteredOut.map(e => e.raw);

  const textarea = document.createElement('textarea');
  textarea.className = 'list-textarea';
  textarea.value = filteredIn.map(e => e.raw).join('\n');
  body.innerHTML = '';
  body.appendChild(textarea);
  textarea.focus();

}

function exitEditMode(listName) {
  if (!editMode[listName]) return;
  const body = document.getElementById(`body-${listName}`);
  const textarea = body.querySelector('textarea');
  if (textarea) {
    const editedLines = textarea.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    // Merge: hidden (filtered-out) entries first, then the edited visible entries
    lists[listName] = [...editModeFilteredOut[listName], ...editedLines];
  }
  editMode[listName] = false;
  editModeFilteredOut[listName] = [];

  const btn = document.getElementById(`edit-${listName}`);
  btn.innerHTML = '<span class="pen-icon">✏</span>';
  btn.classList.add('is-pen');

  saveLists();
  validateAll();
  renderSidebar();
  buildWheel();
}

// ── EVENTS ──
function bindEvents() {
  document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);

  // Wheel click
  document.getElementById('wheel-container').addEventListener('click', () => {
    if (currentScreen !== 'roulette') return;
    activateSpin();
  });

  // Reveal all button
  document.getElementById('btn-reveal-all').addEventListener('click', () => {
    showDetail();
  });

  // Action buttons
  document.getElementById('btn-confirm').addEventListener('click', () => {
    movePokemon(selectedPokemon, 'done');
    returnToRoulette();
  });
  document.getElementById('btn-bio').addEventListener('click', () => {
    const bioEl = document.getElementById('detail-bio');
    const btn = document.getElementById('btn-bio');
    const showing = bioEl.classList.toggle('visible');
    btn.classList.toggle('active', showing);
    if (showing && !bioCache.has(selectedPokemon?.id)) fetchBio(selectedPokemon, bioEl);
    else if (showing) renderBio(bioEl, bioCache.get(selectedPokemon.id));
  });

  document.getElementById('btn-close-detail').addEventListener('click', () => {
    returnToRoulette();
  });
  document.getElementById('btn-remove').addEventListener('click', () => {
    movePokemon(selectedPokemon, 'todo');
    returnToRoulette();
  });

  // Duplicate resolver
  document.getElementById('btn-close-dup').addEventListener('click', () => {
    returnToRoulette();
  });
  document.getElementById('btn-resolve').addEventListener('click', () => {
    resolveDuplicate();
  });
  document.querySelectorAll('.dup-select-all').forEach(btn => {
    btn.addEventListener('click', () => {
      const ln = btn.dataset.list;
      for (const p of getAllDuplicatePokemon()) {
        // Deselect all keys for this pokemon across all lists
        for (const k of [...duplicateSelected]) {
          if (k.startsWith(`${p.id}:`)) duplicateSelected.delete(k);
        }
        // Select all entries in this list for this pokemon
        lists[ln].forEach((raw, idx) => {
          if (matchPokemon(raw)?.id === p.id) duplicateSelected.add(`${p.id}:${ln}:${idx}`);
        });
      }
      renderDuplicateResolver();
    });
  });

  // Space
  document.addEventListener('keydown', (e) => {
    if (e.code !== 'Space') return;
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    e.preventDefault();
    if (currentScreen === 'roulette') {
      activateSpin();
    } else if (currentScreen === 'silhouette') {
      revealNextHint();
    }
    // disabled on detail screen
  });

  // Edit buttons + header collapse toggle
  for (const listName of ['pool', 'done', 'todo']) {
    document.getElementById(`edit-${listName}`).addEventListener('click', (e) => {
      e.stopPropagation();
      if (editMode[listName]) {
        exitEditMode(listName);
      } else {
        for (const ln of ['pool', 'done', 'todo']) {
          if (ln !== listName && editMode[ln]) exitEditMode(ln);
        }
        enterEditMode(listName);
      }
    });

    document.getElementById(`header-${listName}`).addEventListener('click', (e) => {
      if (e.target.closest('.edit-btn')) return;
      togglePanelCollapse(listName);
    });
  }

  // Filters
  document.getElementById('filter-name').addEventListener('input', (e) => {
    filters.name = e.target.value;
    renderSidebar();
  });

  document.querySelectorAll('input[name="sort-order"]').forEach(radio => {
    radio.addEventListener('change', () => {
      if (!radio.checked) return;
      sortOrder = radio.value;
      document.querySelectorAll('input[name="sort-order"]').forEach(r => {
        r.closest('.sort-radio-label').classList.toggle('selected', r === radio);
      });
      renderSidebar();
    });
  });

  document.getElementById('sort-dir').addEventListener('click', () => {
    sortAsc = !sortAsc;
    document.getElementById('sort-dir').classList.toggle('desc', !sortAsc);
    renderSidebar();
  });

  document.getElementById('filter-clear').addEventListener('click', () => {
    filters = { name: '' };
    sortOrder = 'none';
    sortAsc = true;
    document.getElementById('filter-name').value = '';
    document.querySelectorAll('input[name="sort-order"]').forEach(r => {
      r.checked = false;
      r.closest('.sort-radio-label').classList.remove('selected');
    });
    document.getElementById('sort-dir').classList.remove('desc');
    renderSidebar();
  });

  // Tab switching
  document.getElementById('tab-lists').addEventListener('click', () => switchTab('lists'));
  document.getElementById('tab-config').addEventListener('click', () => switchTab('config'));
  document.getElementById('tab-online').addEventListener('click', () => switchTab('online'));

  window.addEventListener('beforeunload', () => closeSSE());

  // Hint radios
  for (const key of ['name', 'sprite', 'types', 'gen', 'dex']) {
    document.querySelectorAll(`input[name="hint-${key}"]`).forEach(radio => {
      radio.addEventListener('change', () => {
        if (!radio.checked) return;
        config.hints[key] = radio.value;
        saveConfig();
        document.querySelectorAll(`input[name="hint-${key}"]`).forEach(r => {
          r.closest('.hint-radio-label').classList.toggle('selected', r === radio);
        });
        refreshSilhouetteHints();
      });
    });
  }

  // Export / Import
  document.getElementById('btn-export').addEventListener('click', () => {
    const str = exportData();
    document.getElementById('import-export-area').value = str;
    navigator.clipboard?.writeText(str).catch(() => {});
  });

  document.getElementById('btn-import').addEventListener('click', () => {
    const str = document.getElementById('import-export-area').value.trim();
    if (!str) return;
    if (!importData(str)) alert('Invalid import data.');
    else document.getElementById('import-export-area').value = '';
  });

  // Reset
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (currentScreen !== 'roulette') return;
    if (!confirm('Reset all lists? This cannot be undone.')) return;
    const selectedGens = new Set(config.gens || []);
    lists = {
      pool:  allPokemon.filter(p => selectedGens.size === 0 || selectedGens.has(p.gen)).map(p => p.name),
      done: [],
      todo: [],
    };
    saveLists();
    validateAll();
    renderSidebar();
    buildWheel();
    spinState = 'idle';
    winner = null;
    updateCenterText();
  });
}

// ── ONLINE: API HELPER ──
async function apiRequest(method, path, body = null) {
  const headers = { 'Content-Type': 'application/json' };
  if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
  try {
    const res = await fetch(API_BASE + path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : null,
    });
    const refreshed = res.headers.get('X-Refreshed-Token');
    if (refreshed) setAuth(refreshed, authUsername);
    let data = null;
    try { data = await res.json(); } catch (_) {}
    return { ok: res.ok, status: res.status, data };
  } catch (_) {
    return { ok: false, status: 0, data: null };
  }
}

// ── ONLINE: SSE ──
function openSSE(code) {
  if (sseSource) sseSource.close();
  const url = `${API_BASE}/rooms/${code}/events`;
  sseSource = new EventSource(`${url}?token=${encodeURIComponent(authToken)}`);

  sseSource.addEventListener('connected', (e) => {
    const data = JSON.parse(e.data);
    currentRoom.members = data.members;
    currentRoom.role = data.role;
    sseConnected = true;
    renderOnlineView();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data.lists));
    lists = data.lists;
    validateAll();
    renderSidebar();
    buildWheel();
  });

  sseSource.addEventListener('lists_updated', (e) => {
    const data = JSON.parse(e.data);
    if (data.updated_by === authUsername) return;
    lists = data.lists;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data.lists));
    validateAll();
    renderSidebar();
    buildWheel();
  });

  sseSource.addEventListener('member_joined', (e) => {
    const data = JSON.parse(e.data);
    currentRoom.members.push({ user_id: data.user_id, role: data.role });
    renderOnlineView();
  });

  sseSource.addEventListener('member_left', (e) => {
    const data = JSON.parse(e.data);
    currentRoom.members = currentRoom.members.filter(m => m.user_id !== data.user_id);
    renderOnlineView();
  });

  sseSource.addEventListener('role_changed', (e) => {
    const data = JSON.parse(e.data);
    const member = currentRoom.members.find(m => m.user_id === data.user_id);
    if (member) member.role = data.role;
    if (data.user_id === authUsername) currentRoom.role = data.role;
    renderOnlineView();
  });

  sseSource.addEventListener('room_closed', (e) => {
    const data = JSON.parse(e.data);
    closeSSE();
    setRoom(null);
    showNotification(`Room was closed by ${data.closed_by}`);
    renderOnlineView();
  });

  sseSource.onerror = () => {
    sseConnected = false;
    renderOnlineView();
  };
}

function closeSSE() {
  if (sseSource) { sseSource.close(); sseSource = null; }
  sseConnected = false;
}

// ── ONLINE: CONNECT HELPER ──
async function connectToRoom(code) {
  const { ok, data } = await apiRequest('POST', `/rooms/${code}/join`);
  if (!ok) return;
  setRoom({ code, role: data.role, members: data.members });
  openSSE(code);
  renderOnlineView();
}

function renderAuthSection() {
  const container = document.getElementById('view-online');
  let activeSubtab = 'signin';
  let savedUsername = '';
  let savedPassword = '';

  function render() {
    container.innerHTML = '';
    const tabRow = el('div', 'online-tabs');
    const sinBtn = el('button', `online-tab${activeSubtab==='signin'?' active':''}`, 'Sign In');
    const regBtn = el('button', `online-tab${activeSubtab==='register'?' active':''}`, 'Register');
    sinBtn.addEventListener('click', () => {
      savedUsername = userInput.value;
      savedPassword = passInput.value;
      activeSubtab = 'signin';
      render();
    });
    regBtn.addEventListener('click', () => {
      savedUsername = userInput.value;
      savedPassword = passInput.value;
      activeSubtab = 'register';
      render();
    });
    tabRow.append(sinBtn, regBtn);
    container.appendChild(tabRow);

    const errDiv = el('div', 'online-error');

    const userField = el('div', 'online-field');
    const userLabel = el('label', 'online-label', 'Username');
    const userInput = elInput('text', 'online-input', 'username');
    userInput.value = savedUsername;
    userField.append(userLabel, userInput);

    const passField = el('div', 'online-field');
    const passLabel = el('label', 'online-label', 'Password');
    const passInput = elInput('password', 'online-input', '');
    passInput.value = savedPassword;
    passField.append(passLabel, passInput);

    container.append(userField, passField);

    let confirmInput = null;
    if (activeSubtab === 'register') {
      const confirmField = el('div', 'online-field');
      const confirmLabel = el('label', 'online-label', 'Confirm password');
      confirmInput = elInput('password', 'online-input', '');
      confirmField.append(confirmLabel, confirmInput);
      container.appendChild(confirmField);
    }

    const btnLabel = activeSubtab === 'signin' ? 'Sign In' : 'Register';
    const submitBtn = el('button', 'online-btn online-btn-primary', btnLabel);

    submitBtn.addEventListener('click', async () => {
      errDiv.textContent = '';
      const u = userInput.value.trim();
      const p = passInput.value;
      if (!u || !p) { errDiv.textContent = 'Username and password required'; return; }
      if (activeSubtab === 'register') {
        if (confirmInput.value !== p) { errDiv.textContent = 'Passwords do not match'; return; }
      }
      submitBtn.disabled = true;
      if (activeSubtab === 'signin') await handleSignIn(u, p, errDiv);
      else await handleRegister(u, p, errDiv);
      submitBtn.disabled = false;
    });

    container.append(submitBtn, errDiv);
  }

  render();
}

function renderActiveRoomSection() {

    } else if (canAssignRoles()) {
      const menuDiv = el('div', 'online-member-menu');
      const menuBtn = el('button', 'online-member-menu-btn', '…');
      let dropOpen = false;
      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropOpen = !dropOpen;
        if (dropOpen) {
          const drop = el('div', 'online-dropdown');
          const assignableRoles = getAssignableRoles();
          for (const role of assignableRoles) {
            if (role === member.role) continue;
            const item = el('button', 'online-dropdown-item', `Set ${role}`);
            item.addEventListener('click', async () => {
              drop.remove();
              await handleAssignRole(member.user_id, role);

            drop.appendChild(item);
          }
          menuDiv.appendChild(drop);
          document.addEventListener('click', () => drop.remove(), { once: true });

      });

      row.appendChild(menuDiv);
    }

  }

  container.appendChild(el('hr', 'online-divider'));

  const roomErr = el('div', 'online-error');

  const leaveBtn = el('button', 'online-btn online-btn-secondary', 'Leave Room');
  const otherCount = currentRoom.members.filter(m => m.user_id !== authUsername).length;
  if (currentRoom.role === 'host' && otherCount > 0) {

    const closeBtn = el('button', 'online-btn online-btn-danger', 'Close Room');

      if (!confirm('Close this room for all members?')) return;
      closeBtn.disabled = true;
      await handleCloseRoom(roomErr);
    });
    container.appendChild(closeBtn);
  }
  container.appendChild(roomErr);
}

// ── ONLINE: DOM HELPERS ──
function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

function elInput(type, className, placeholder) {
  const e = document.createElement('input');
  e.type = type;
  e.className = className;
  e.placeholder = placeholder;
  return e;
}

// ── ONLINE: ROOM CODE HELPERS ──
// Live version: keeps trailing dashes so typing "my-room" isn't interrupted.
function sanitizeRoomCodeLive(raw) {
  return raw
    .toLowerCase()
    .replace(/[\s_]+/g, '-')
    .replace(/[^a-z0-9-]/g, '')
    .replace(/-{2,}/g, '-')
    .replace(/^-+/, '');
}

// Final version (used for submission): also strips trailing dashes.
function sanitizeRoomCode(raw) {
  return sanitizeRoomCodeLive(raw).replace(/-+$/, '');
}

function isValidRoomCode(code) {
  return /^[a-z0-9]([a-z0-9-]*[a-z0-9])?$/.test(code) && code.length >= 3 && code.length <= 32;
}

// ── ONLINE: ROLE HELPERS ──
function canAssignRoles() {
  return currentRoom.role === 'host' || currentRoom.role === 'moderator';
}

function getAssignableRoles() {
  if (currentRoom.role === 'host') return ['host', 'moderator', 'guest'];
  if (currentRoom.role === 'moderator') return ['guest'];
  return [];
}

// ── ONLINE: AUTH HANDLERS ──
function setRoom(room) {
  currentRoom = room;
  if (room) {
    localStorage.setItem(ROOM_CODE_KEY, room.code);
    history.replaceState(null, '', '#' + room.code);
  } else {
    localStorage.removeItem(ROOM_CODE_KEY);
    history.replaceState(null, '', window.location.pathname);
  }
}

function setAuth(token, username) {
  authToken = token;
  authUsername = username;
  if (token) {
    localStorage.setItem('pokeroulette_auth_token', token);
    localStorage.setItem('pokeroulette_auth_user', username);
  } else {
    localStorage.removeItem('pokeroulette_auth_token');
    localStorage.removeItem('pokeroulette_auth_user');
  }
}

  setAuth(data.token, username);
  await tryAutoJoin() || renderOnlineView();
}

async function handleRegister(username, password, errDiv) {

  if (!ok) { errDiv.textContent = data?.error ?? 'Registration failed'; return; }
  setAuth(data.token, username);
  await tryAutoJoin() || renderOnlineView();
}

  const code = pendingRoomCode;

  await handleJoinRoom(code, { set textContent(v) {} }); // silent error sink

// ── CUSTOM COLOR PICKER ──
function hexToHsl(hex) {
  let r = parseInt(hex.slice(1,3),16)/255;
  let g = parseInt(hex.slice(3,5),16)/255;
  let b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if (max === min) { h = s = 0; }
  else {
    const d = max - min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    switch(max) {
      case r: h = ((g-b)/d + (g<b?6:0))/6; break;
      case g: h = ((b-r)/d + 2)/6; break;
      case b: h = ((r-g)/d + 4)/6; break;
    }
  }
  return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  return '#' + [f(0),f(8),f(4)].map(v => Math.round(v*255).toString(16).padStart(2,'0')).join('');
}

function openColorPicker(anchor, initialHex, onChange) {
  document.querySelector('.cp-popup')?.remove();

  let [h, s, l] = hexToHsl(initialHex);

  const popup = document.createElement('div');
  popup.className = 'cp-popup';

  const preview = document.createElement('div');
  preview.className = 'cp-preview';

  const makeSlider = (labelText, min, max, getValue, onInput, gradientFn) => {
    const wrap = document.createElement('div');
    wrap.className = 'cp-row';
    const lbl = document.createElement('label');
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.className = 'cp-slider';
    slider.min = min; slider.max = max;
    slider.value = getValue();
    const updateTrack = () => { slider.style.background = gradientFn(); };
    slider.addEventListener('input', () => {
      onInput(parseInt(slider.value));
      updateTrack();
      syncAll();
    });
    lbl.append(document.createTextNode(labelText), document.createTextNode(''));
    wrap.append(lbl, slider);
    updateTrack();
    return { wrap, slider, updateTrack };
  };

  const hueSlider  = makeSlider('Hue',        0, 360, () => h, v => { h = v; },
    () => `linear-gradient(to right,hsl(0,100%,50%),hsl(30,100%,50%),hsl(60,100%,50%),hsl(120,100%,50%),hsl(180,100%,50%),hsl(240,100%,50%),hsl(300,100%,50%),hsl(360,100%,50%))`);
  const satSlider  = makeSlider('Saturation', 0, 100, () => s, v => { s = v; },
    () => `linear-gradient(to right,hsl(${h},0%,${l}%),hsl(${h},100%,${l}%))`);
  const litSlider  = makeSlider('Lightness',  0, 100, () => l, v => { l = v; },
    () => `linear-gradient(to right,hsl(${h},${s}%,0%),hsl(${h},${s}%,50%),hsl(${h},${s}%,100%))`);

  const hexRow = document.createElement('div');
  hexRow.className = 'cp-hex-row';
  const hexInput = document.createElement('input');
  hexInput.className = 'online-input';
  hexInput.type = 'text';
  hexInput.maxLength = 7;
  hexInput.spellcheck = false;

  hexInput.addEventListener('input', () => {
    const v = hexInput.value.trim();
    if (/^#[0-9a-fA-F]{6}$/.test(v)) {
      [h, s, l] = hexToHsl(v);
      hueSlider.slider.value = h;
      satSlider.slider.value = s;
      litSlider.slider.value = l;
      [hueSlider, satSlider, litSlider].forEach(x => x.updateTrack());
      syncAll(false);
    }
  });
  hexRow.appendChild(hexInput);

  function syncAll(updateHex = true) {
    const hex = hslToHex(h, s, l);
    preview.style.background = hex;
    if (updateHex) hexInput.value = hex;
    satSlider.updateTrack();
    litSlider.updateTrack();
    onChange(hex);
  }

  popup.append(preview, hueSlider.wrap, satSlider.wrap, litSlider.wrap, hexRow);
  document.body.appendChild(popup);
  syncAll();

  // Position: prefer left of anchor, flip right if off-screen, adjust vertical
  const rect = anchor.getBoundingClientRect();
  const pw = 218, ph = 210;
  let left = rect.left - pw - 8;
  if (left < 8) left = rect.right + 8;
  let top = rect.top;
  if (top + ph > window.innerHeight - 8) top = window.innerHeight - ph - 8;
  if (top < 8) top = 8;
  popup.style.left = left + 'px';
  popup.style.top  = top  + 'px';

  const close = (e) => { if (!popup.contains(e.target) && e.target !== anchor) { popup.remove(); document.removeEventListener('pointerdown', close); } };
  setTimeout(() => document.addEventListener('pointerdown', close));
}

init();
</script>
</body>
</html>
